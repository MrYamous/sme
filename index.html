<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Calculateur de livraison</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container">

    <h1>Calculateur de livraison</h1>

    <form id="calculator">

        <label>
            Département
            <select id="department"></select>
        </label>

        <label>
            Nombre de bouteilles
            <input
                id="bottles"
                type="number"
                min="1"
                required
            >
        </label>

        <label>
            Taxe gasoil
            <input
                id="fuelMultiplier"
                type="number"
                step="0.001"
            >
        </label>

        <label>
            <input type="checkbox" id="appointment">
            Livraison sur rendez-vous ou particulier
        </label>

        <button type="submit">
            Calculer
        </button>

    </form>

    <div id="result" hidden></div>

</main>

<script type="module" src="app.js"></script>

</body>
</html>
